<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل قبور العائلة</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#203d34;font-family:Tahoma,Arial,sans-serif}header{background:#203d34;color:white;padding:23px max(18px,calc((100vw - 1150px)/2));}header h1{margin:0 0 8px;font-size:26px}header p{margin:0;color:#dce8e2;font-size:13px}
main{max-width:1150px;margin:25px auto;padding:0 15px}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}.top input{flex:1;min-width:0}input,textarea,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #d6dcd8}button,.btn{cursor:pointer;background:#245d49;color:white;border:0;text-decoration:none;display:inline-block;text-align:center;padding:12px 15px;border-radius:8px}button:hover,.btn:hover{background:#1c4537}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}.postcard{overflow:hidden;border-radius:28px;background:white;border:1px solid #e1e5df;box-shadow:0 6px 18px #203d3412}.postcard .head{background:#203d34;color:white;height:135px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:23px;line-height:1.6;font-weight:bold}.postcard .details{padding:22px 17px;min-height:115px;text-align:right;font-size:17px;line-height:1.9}.postcard .links{background:#203d34;padding:13px 0;display:grid;gap:7px}.postcard .links button,.postcard .links a{border:0;background:white;color:#203d34;border-radius:0;font-size:16px;padding:12px 8px;text-align:center;text-decoration:none;cursor:pointer}.postcard .links button:hover,.postcard .links a:hover{background:#e4eee8}#map{height:440px;border-radius:16px;margin-bottom:23px}.hidden{display:none!important}.muted{color:#69776f;font-size:13px}.empty{padding:35px;text-align:center;background:white;border-radius:14px}footer{text-align:center;padding:35px;color:#64786d}@media(max-width:600px){.top{flex-wrap:wrap}.top input{flex-basis:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.postcard{border-radius:18px}.postcard .head{height:110px;font-size:16px;padding:8px}.postcard .details{font-size:13px;padding:12px 9px;min-height:95px}.postcard .links{padding:8px 0;gap:5px}.postcard .links button,.postcard .links a{font-size:12px;padding:9px 2px}#map{height:330px}header h1{font-size:22px}}
</style></head><body><header><h1>دليل قبور العائلة</h1><p>رحم الله من رحلوا، وجعل قبورهم روضة من رياض الجنة</p></header><main><div class="top"><input id="q" placeholder="ابحث باسم المتوفى أو رقم القبر" aria-label="بحث"><button onclick="reset()">عرض جميع القبور</button><button onclick="toggleMap()">إظهار / إخفاء الخريطة</button></div><div id="map"></div><div id="cards" class="grid"></div><p class="muted">مواقع القبور حسب الإحداثيات المدخلة من العائلة. قد تختلف دقة GPS داخل المقبرة.</p></main><footer>دليل قبور العائلة</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const graves=[{"id": "g1", "name": "أحمد علي مصطفى علي", "death": "2017-05-23", "number": "20 / 40", "lat": 31.839529872515712, "lng": 36.031128603958166, "notes": ""}];
const center=[31.839529872515712,36.031128603958166];
const map=L.map('map').setView(center,18);
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri, Maxar, Earthstar Geographics'});
satellite.addTo(map);
const roads=L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
L.control.layers({'صور الأقمار الصناعية':satellite,'خريطة الطرق':roads}).addTo(map);
const markers=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
graves.forEach(g=>{const m=L.marker([g.lat,g.lng]).addTo(map);m.bindPopup('<strong>'+esc(g.name)+'</strong><br>رقم القبر: '+esc(g.number));markers.set(g.id,m)});
function focus(id){let m=markers.get(id);if(!m)return;document.getElementById('map').classList.remove('hidden');map.invalidateSize();map.setView(m.getLatLng(),19);m.openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth'})}
function toggleMap(){document.getElementById('map').classList.toggle('hidden');if(!document.getElementById('map').classList.contains('hidden'))setTimeout(()=>map.invalidateSize(),30)}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const matches=graves.filter(g=>(g.name+' '+g.number).toLowerCase().includes(q));document.getElementById('cards').innerHTML=matches.map(g=>'<article class="postcard"><div class="head">'+esc(g.name)+'</div><div class="details"><div>تاريخ الوفاة: '+esc(g.death||'—')+'</div><div>رقم القبر: '+esc(g.number||'—')+'</div></div><div class="links"><button data-focus="'+esc(g.id)+'">إظهار القبر على الخريطة</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(g.lat+','+g.lng)+'">Google Maps</a></div></article>').join('')||'<div class="empty">لا توجد نتائج مطابقة</div>';document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>focus(b.dataset.focus)))}
function reset(){document.getElementById('q').value='';render();document.getElementById('map').classList.remove('hidden');map.invalidateSize();if(graves.length>1)map.fitBounds([...markers.values()].map(m=>m.getLatLng()),{padding:[40,40],maxZoom:18});else map.setView(center,18)}
document.getElementById('q').addEventListener('input',render);render();
</script></body></html>
