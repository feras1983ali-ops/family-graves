<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل قبور العائلة</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><h1>دليل قبور العائلة</h1><p>رحم الله من رحلوا، وجعل قبورهم روضة من رياض الجنة</p></header><main><section id="login" class="panel login"><h2>دخول أفراد العائلة</h2><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>دخول</button></form><p id="loginMsg" class="msg"></p><button type="button" class="alt" id="toggleSignup">طلب الانضمام للعائلة</button><form id="signupForm" class="hidden"><h3>طلب انضمام جديد</h3><label>الاسم الكامل<input id="signupName" required maxlength="100"></label><label>البريد الإلكتروني<input id="signupEmail" type="email" required></label><label>كلمة المرور (8 أحرف على الأقل)<input id="signupPassword" type="password" minlength="8" required></label><button type="submit">إرسال طلب الانضمام</button></form><p id="signupMsg" class="msg"></p></section><section id="content" class="hidden"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو رقم القبر"><button id="all">عرض جميع القبور</button><button id="mapToggle" class="alt">إظهار / إخفاء الخريطة</button><a id="adminLink" class="button hidden" href="admin.html">لوحة الإدارة</a><button id="logout" class="alt">خروج</button></div><div id="map"></div><div id="cards" class="cards"></div><p class="muted">المواقع حسب الإحداثيات المدخلة من العائلة. قد تختلف دقة تحديد GPS داخل المقبرة.</p></section><p id="status" class="msg"></p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="common.js"></script><script src="site.js"></script><script src="signup.js"></script></body></html>
